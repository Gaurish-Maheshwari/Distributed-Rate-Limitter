# Two stateless API instances + one shared Redis + nginx load balancer.
# Hit http://localhost:8080 repeatedly: limits are enforced globally across
# both instances because all counters live in Redis.
x-api: &api
  build: .
  environment:
    RL_REDIS_URL: redis://redis:6379/0
    RL_TRUST_PROXY_HEADERS: "true"      # nginx sets X-Forwarded-For
    RL_ADMIN_API_KEY: ${RL_ADMIN_API_KEY:-change-me}
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api1:
    <<: *api
  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
